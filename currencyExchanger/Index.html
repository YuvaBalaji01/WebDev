<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="style.css">
      <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css"
      integrity="sha512-DTOQO9RWCH3ppGqcWaEA1BIZOC6xxalwEsw9c2QQeAIftl+Vegovlnee1c9QX4TctnWMn13TZye+giMm8e2LwA=="
      crossorigin="anonymous"
      referrerpolicy="no-referrer"
    />
</head>
<body>
    
    
    <div class="container">

        <h1>Currency Converter </h1>
        <input type="number" id="ip" placeholder="Enter Amount">
        <form action="">

            <div class="dropdown">

                <div>
                    <label>From</label>
                    <div class="select-container">
                        <img src="https://flagsapi.com/US/flat/64.png" id="fromimg">
                        <select name="From" id="from"></select>
                    </div>
                </div>

                <i class="fas fa-right-left exchange"></i>

                <div>
                    <label>To</label>
                    <div class="select-container">
                        <img src="https://flagsapi.com/IN/flat/64.png" id="toimg">
                        <select name="To" id="to"></select>
                    </div>
                </div>

            </div>

            <h3 class="msg">1 USD = 83.50 INR</h3>

            <button>Convert</button>
        </form>

    </div>
    <script src="codes.js"></script>
    <script src="script.js"></script>
    
</body>
</html>
